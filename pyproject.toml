[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mog-mock"
version = "0.1.0"
description = "Mock HTTP server for OpenAPI, Swagger and raw JSON payloads"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "escsyntax-sudo" }]
keywords = ["openapi", "swagger", "mock", "server", "testing", "fake-data"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dev = ["PyYAML>=6.0"]

[project.scripts]
mog = "mog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
